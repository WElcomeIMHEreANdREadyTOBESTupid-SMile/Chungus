<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BIG BIG CHUNGUS</title>
    <link rel="icon" type="image/png" href="big-chungus.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: black;
            color: white;
            font-family: monospace;
            overflow: hidden;
        }

        #text {
            padding: 40px;
            font-size: 24px;
            line-height: 1.5;
            white-space: pre-wrap;

            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #startScreen {
            position: fixed;
            inset: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: monospace;
            font-size: 24px;
            text-align: center;
            z-index: 10;
        }

        #clickMe {
            cursor: pointer;
            display: inline-block;
        }

        #clickMe:hover {
            color: red;
        }

        #redText {
            position: fixed;
            inset: 0;
            padding: 10px;
            color: red;
            font-size: 20px;
            line-height: 1.2;
            font-family: monospace;
            overflow: hidden;
            display: none;
        }

        #blackout {
            position: fixed;
            inset: 0;
            background: black;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 1.5s ease;
        }

        #blackout.active {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="startScreen">
        <div>
            MY FIRST NAME IS BIG
            <br>
            MY MIDDLE NAME IS BIG
            <br>
            MY LAST NAME IS CHUNGUS
            <br>
            <br>

            <span id="clickMe">c l i c k &nbsp; m e</span>
        </div>
    </div>

    <div id="text"></div>
    <div id="redText"></div>
    <div id="blackout"></div>

    <script>
        const message =
            "You've pushed things further than you realize, and I won't keep overlooking it. " +
            "Consider this your warning to stop before the situation gets worse. " +
            "What happens next will depend entirely on the choices you make from this point forward..........";

        const startScreen = document.getElementById("startScreen");
        const clickMe = document.getElementById("clickMe");
        const output = document.getElementById("text");
        const redText = document.getElementById("redText");
        const blackout = document.getElementById("blackout");

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

async function typeMessage() {
    let currentText = "";

    const specialCharacters =
        "!@#$%^&*()-_=+[]{}<>?/\\|~";

    for (const letter of message) {

        if (letter === " ") {
            currentText += " ";
            output.textContent = currentText;
            continue;
        }

        if (/[.,!?]/.test(letter)) {
            currentText += letter;
            output.textContent = currentText;
            await wait(letter === "." ? 1000 : 100);
            continue;
        }

        // Random symbol appears briefly
        const randomChar =
            specialCharacters[
                Math.floor(Math.random() * specialCharacters.length)
            ];

        output.textContent = currentText + randomChar;

        await wait(35);

        // Replace it with the real letter
        currentText += letter;
        output.textContent = currentText;

        await wait(15);
    }
}
        
        async function fillScreenWithRedText() {
            await wait(1000);

            output.style.display = "none";
            redText.style.display = "block";

            const repeatedText =
                "YOU'VE PUSHED THINGS FURTHER THAN YOU REALIZE. ";

            while (redText.scrollHeight <= window.innerHeight * 2) {
                redText.textContent += repeatedText;
                await wait(20);
            }

            // Keep the red screen visible for 2 seconds
            await wait(2000);

            // Fade to black
            blackout.classList.add("active");

            await wait(1600);

            // Attempt to close the tab
            window.close();

            // If the browser blocks window.close(),
            // leave the page completely black.
            document.body.innerHTML = "";
            document.body.style.background = "black";
        }

        // ONLY "c l i c k me" starts the sequence
        clickMe.addEventListener("click", async () => {
            startScreen.style.display = "none";

            await wait(1000);

            await typeMessage();

            await fillScreenWithRedText();
        });
    </script>

</body>
</html>
